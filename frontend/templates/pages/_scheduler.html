<div id="scheduler-content" style="display: none;" class="p-4 pb-6 md:p-8 md:pb-10 bg-white dark:bg-gray-800 md:border md:border-gray-200 dark:md:border-gray-700 md:rounded-lg">
    <div class="mb-6 flex flex-col md:flex-row md:items-start md:justify-between gap-4">
        <div class="min-w-0 md:flex-1">
            <h1 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-gray-100 mb-2 sm:mb-3">Refresh Schedule</h1>
            <p class="text-sm sm:text-base text-gray-600 dark:text-gray-300">See when each playlist will refresh next. Open a playlist for its full history.</p>
        </div>
        <div class="flex flex-col sm:flex-row md:flex-col lg:flex-row items-stretch sm:items-center md:items-stretch lg:items-center gap-2 flex-none">
            <button id="scheduler-show-all-btn" type="button" aria-pressed="false"
                class="inline-flex items-center justify-center gap-1.5 px-3 py-2 text-sm font-medium whitespace-nowrap text-gray-900 dark:text-gray-100 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg w-full sm:w-auto md:w-full lg:w-auto">
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
                </svg>
                <span id="scheduler-show-all-label">Show all playlists</span>
            </button>
            <button id="scheduler-refresh-btn" type="button"
                class="inline-flex items-center justify-center gap-1.5 px-3 py-2 text-sm font-medium whitespace-nowrap text-gray-900 dark:text-gray-100 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg w-full sm:w-auto md:w-full lg:w-auto">
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6M1 19v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0018.49 15"/>
                </svg>
                Reload
            </button>
            <button id="scheduler-clear-history-btn" type="button"
                class="inline-flex items-center justify-center gap-1.5 px-3 py-2 text-sm font-medium whitespace-nowrap text-red-600 dark:text-red-400 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg w-full sm:w-auto md:w-full lg:w-auto">
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h6c1 0 2 1 2 2v2"/>
                </svg>
                Clear history
            </button>
        </div>
    </div>

    <!-- Queue summary -->
    <div id="scheduler-queue-summary" class="hidden mb-4 p-3 rounded-lg bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 text-sm text-blue-800 dark:text-blue-300"></div>

    <div id="scheduler-loading" class="hidden text-center p-4 rounded-lg mb-4 bg-gray-50 dark:bg-gray-700/50">
        <span class="text-gray-600 dark:text-gray-400">Loading refresh schedule...</span>
    </div>

    <div id="scheduler-tiles" class="flex flex-col gap-2"></div>

    <div id="scheduler-empty" class="hidden text-center p-8 text-gray-500 dark:text-gray-400">
        <p id="scheduler-empty-title" class="text-lg mb-2">No scheduled playlists</p>
        <p id="scheduler-empty-hint" class="text-sm">Set a refresh schedule on a playlist to see it here.</p>
    </div>
</div>
