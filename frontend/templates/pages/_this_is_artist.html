<div id="this-is-content" style="display: none;" class="p-4 pb-6 md:p-8 md:pb-10 bg-white dark:bg-gray-800 md:border md:border-gray-200 dark:md:border-gray-700 md:rounded-lg">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100 mb-3">This is <span class="text-gray-400 dark:text-gray-500">Artist</span></h1>
        <p class="text-gray-600 dark:text-gray-300">Create a 'This Is' playlist for a single artist from your library. Get a curated mix of their best tracks, intelligently selected for the perfect listening experience.</p>
    </div>

    <form id="this-is-form" class="space-y-6">
        <div>
            <label for="artist-search-select" class="block text-sm text-gray-900 dark:text-gray-100 font-bold mb-2">Choose an artist from your library</label>
            <div class="relative">
                <select
                    id="artist-search-select"
                    data-hs-select='{
                        "placeholder": "Search for an artist...",
                        "toggleTag": "<button type=\"button\"></button>",
                        "toggleClasses": "hs-select-disabled:pointer-events-none hs-select-disabled:opacity-50 relative py-3 px-4 pe-9 flex text-nowrap w-full cursor-pointer bg-white dark:text-gray-200 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-start text-sm focus:border-blue-500 focus:ring-blue-500 before:absolute before:inset-0 before:z-[1]",
                        "dropdownClasses": "hs-select-dropdown mt-2 z-50 w-full max-h-72 p-1 space-y-0.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-gray-800 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-gray-600",
                        "optionClasses": "py-2 px-4 w-full text-sm text-gray-800 dark:text-gray-200 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg focus:outline-none focus:bg-gray-100 dark:focus:bg-gray-700",
                        "optionTemplate": "<div class=\"flex justify-between items-center w-full\"><span data-title></span><span class=\"hs-selected:block\"><svg class=\"flex-shrink-0 size-3.5 text-blue-600 hidden hs-selected:inline-block\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg></span></div>",
                        "hasSearch": true,
                        "searchPlaceholder": "Search...",
                        "searchClasses": "block w-full text-sm border-gray-200 dark:text-gray-200 dark:border-gray-700 dark:bg-gray-800 rounded-lg focus:border-blue-500 focus:ring-blue-500 before:absolute before:inset-0 before:z-[1] py-2 px-3",
                        "searchWrapperClasses": "bg-white dark:bg-gray-800 p-2 -mx-1 sticky top-0"
                    }'
                    class="hidden"
                >
                    <option value="">Choose an artist</option>
                </select>
            </div>
        </div>

        <div class="navidrome-top-tracks-controls space-y-3 rounded-lg border border-gray-200 dark:border-gray-700 p-4">
            <label for="this-is-top-tracks-count" class="block text-sm text-gray-900 dark:text-gray-100 font-bold">Top Tracks per Artist</label>
            <div class="flex items-center gap-3">
                <input type="range" id="this-is-top-tracks-count" min="0" max="20" value="15" class="h-2 w-full cursor-pointer appearance-none rounded-lg bg-gray-200 dark:bg-gray-700 accent-blue-600">
                <output for="this-is-top-tracks-count" id="this-is-top-tracks-count-value" class="min-w-8 text-center px-2 py-1 border border-gray-200 dark:border-gray-700 rounded-md bg-gray-50 dark:bg-gray-900 text-sm font-bold text-gray-900 dark:text-gray-100">15</output>
            </div>
            <p class="text-xs text-gray-400 dark:text-gray-500">Fetches up to this many popular songs. Set to 0 to disable.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm text-gray-900 dark:text-gray-100 font-bold mb-3">Playlist Length</label>
                <div class="space-y-3">
                    <div class="flex items-center">
                        <input type="radio" id="artist-length-25" name="artist-playlist-length" value="25" checked class="shrink-0 mt-0.5 border-gray-200 dark:border-gray-700 rounded-full text-blue-600 focus:ring-blue-500">
                        <label for="artist-length-25" class="text-sm text-gray-500 dark:text-gray-400 ms-2">25 tracks</label>
                    </div>
                    <div class="flex items-center">
                        <input type="radio" id="artist-length-50" name="artist-playlist-length" value="50" class="shrink-0 mt-0.5 border-gray-200 dark:border-gray-700 rounded-full text-blue-600 focus:ring-blue-500">
                        <label for="artist-length-50" class="text-sm text-gray-500 dark:text-gray-400 ms-2">50 tracks</label>
                    </div>
                    <div class="flex items-center">
                        <input type="radio" id="artist-length-100" name="artist-playlist-length" value="100" class="shrink-0 mt-0.5 border-gray-200 dark:border-gray-700 rounded-full text-blue-600 focus:ring-blue-500">
                        <label for="artist-length-100" class="text-sm text-gray-500 dark:text-gray-400 ms-2">100 tracks</label>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-900 dark:text-gray-100 font-bold mb-3">Refresh Frequency</label>
                <div class="space-y-3">
                    <div class="flex items-center">
                        <input type="radio" id="artist-freq-none" name="artist-refresh-frequency" value="none" checked class="shrink-0 mt-0.5 border-gray-200 dark:border-gray-700 rounded-full text-blue-600 focus:ring-blue-500">
                        <label for="artist-freq-none" class="text-sm text-gray-500 dark:text-gray-400 ms-2">Don't refresh</label>
                    </div>
                    <div class="flex items-center">
                        <input type="radio" id="artist-freq-daily" name="artist-refresh-frequency" value="daily" class="shrink-0 mt-0.5 border-gray-200 dark:border-gray-700 rounded-full text-blue-600 focus:ring-blue-500">
                        <label for="artist-freq-daily" class="text-sm text-gray-500 dark:text-gray-400 ms-2">Daily <span class="text-xs text-gray-500 dark:text-gray-400">(1am)</span></label>
                    </div>
                    <div class="flex items-center">
                        <input type="radio" id="artist-freq-weekly" name="artist-refresh-frequency" value="weekly" class="shrink-0 mt-0.5 border-gray-200 dark:border-gray-700 rounded-full text-blue-600 focus:ring-blue-500">
                        <label for="artist-freq-weekly" class="text-sm text-gray-500 dark:text-gray-400 ms-2">Weekly <span class="text-xs text-gray-500 dark:text-gray-400">(Monday 1am)</span></label>
                    </div>
                    <div class="flex items-center">
                        <input type="radio" id="artist-freq-monthly" name="artist-refresh-frequency" value="monthly" class="shrink-0 mt-0.5 border-gray-200 dark:border-gray-700 rounded-full text-blue-600 focus:ring-blue-500">
                        <label for="artist-freq-monthly" class="text-sm text-gray-500 dark:text-gray-400 ms-2">Monthly <span class="text-xs text-gray-500 dark:text-gray-400">(1st of month 1am)</span></label>
                    </div>
                </div>
            </div>
        </div>

        <div class="pt-4">
            <button type="submit" id="create-artist-playlist-btn" class="w-full md:w-auto bg-gray-900 dark:bg-gray-900 text-white dark:text-gray-100 font-bold py-2 px-4 md:px-6 rounded-lg hover:bg-gray-700 dark:hover:bg-gray-700 focus:ring-offset-2 dark:focus:ring-offset-gray-900 transition-colors">
                Create Playlist
            </button>
        </div>
    </form>
</div>
