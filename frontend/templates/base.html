<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Magic Lists</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            plugins: [
                function ({ addVariant }) {
                    addVariant('hs-selected', ['&.selected', '.selected &']);
                }
            ]
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/preline@latest/dist/preline.min.js"></script>

    <style>
        body {
            font-family: "Inter", sans-serif;
            font-optical-sizing: auto;
            font-style: normal;
            -webkit-font-smoothing: antialiased;
            font-size: 16px;
        }

        .app-container {
            max-width: 1024;
            margin: 0 auto;
        }

        .font-serif {
            font-family: "IBM Plex Serif", serif;
            font-weight: 400;
            font-style: normal;
        }

        .blacklist-toggle {
            color: #9ca3af;
        }

        .blacklist-toggle.has-value {
            color: #111827;
        }
    </style>
</head>

<body class="bg-gray-100">
    <div id="magic" class="flex flex-col min-h-screen md:max-w-[1024px] md:mx-auto relative">
        {% include "partials/_header.html" %}

        <div class="flex flex-1 relative">
            {% include "partials/_toast.html" %}

            {% include "partials/_sidebar.html" %}

            <main class="flex-1 mt-3 md:mt-0 md:p-0 md:pr-4 md:py-0 md:pt-0">
                {% block content %}{% endblock %}
            </main>
        </div>

        <footer class="py-5 px-4 mt-auto">
            <div class="flex flex-col w-full md:flex-row justify-center items-center">
                <div
                    class="flex flex-row flex-grow max-w-96 text-gray-500 text-center text-sm mb-2 md:mb-0 justify-between items-between">
                    <a href="https://miles.pickull.de"
                        class="text-indigo-600 hover:text-indigo-800 transition-color border-b border-indigo-200">
                        &copy; 2026
                    </a>
                    –
                    <a href="#" data-page="terms"
                        class="text-indigo-600 hover:text-indigo-800 transition-color border-b border-indigo-200">
                        Terms
                    </a>
                    –
                    <div>
                        License
                        <a href="https://mit-license.org/"
                            class="text-indigo-600 hover:text-indigo-800 transition-color border-b border-indigo-200">
                            (MIT)
                        </a>
                    </div>
                    –
                    <div class="flex flex-row">
                        <a href="https://github.com/pirus99/magic-lists-for-navidrome"
                            class="mt-0.5">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4">
                                </path>
                                <path d="M9 18c-4.51 2-5-2-7-2"></path>
                            </svg>
                        </a>
                        <a href="https://github.com/pirus99/magic-lists-for-navidrome/issues"
                            class="ml-1 text-indigo-600 hover:text-indigo-800 transition-color border-b border-indigo-200">
                            Issues
                        </a>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    {% include "modals/_edit_playlist_modal.html" %}

    <script src="/static/utils.js"></script>
    <script src="/static/api.js"></script>
    <script src="/static/ui/selects.js"></script>
    <script src="/static/ui/toasts.js"></script>
    <script src="/static/ui/nav.js"></script>
    <script src="/static/ui/modals.js"></script>
    <script src="/static/playlists.js"></script>
    <script src="/static/main.js"></script>
    <script src="/static/app.js?v=1.1.0"></script>
</body>

</html>
