<!-- Clear refresh history confirmation modal -->
<div id="clear-history-modal-overlay"
    class="hidden fixed inset-0 z-[80] bg-black bg-opacity-50 dark:bg-black dark:bg-opacity-70 transition-opacity duration-300">
</div>
<div id="clear-history-modal" class="hidden fixed inset-0 z-[81] flex items-center justify-center p-4" role="dialog"
    aria-modal="true" aria-labelledby="clear-history-modal-title" aria-describedby="clear-history-modal-description">
    <div class="bg-white dark:bg-gray-900 w-full max-w-md rounded-lg shadow-xl border border-gray-200 dark:border-gray-700">
        <div class="flex items-start gap-3 p-4 border-b border-gray-200 dark:border-gray-700">
            <div
                class="flex-none flex items-center justify-center size-9 rounded-full bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400">
                <svg class="size-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h6c1 0 2 1 2 2v2" />
                    <path d="M8 10v10M12 10v10M16 10v10" />
                </svg>
            </div>
            <div class="min-w-0 flex-1">
                <h3 id="clear-history-modal-title" class="text-lg font-semibold text-gray-900 dark:text-gray-100">
                    Clear Refresh History
                </h3>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">This action cannot be undone</p>
            </div>
            <button id="clear-history-close-top" type="button"
                class="flex-none flex justify-center items-center size-6 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full">
                <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
                <span class="sr-only">Close</span>
            </button>
        </div>

        <div class="p-4 space-y-3">
            <p id="clear-history-modal-description" class="text-sm text-gray-700 dark:text-gray-300">
                Are you sure you want to clear the refresh history for
                <span id="clear-history-modal-scope"
                    class="font-semibold text-gray-900 dark:text-gray-100 break-words">all playlists</span>?
            </p>
            <p class="text-sm text-gray-600 dark:text-gray-400">
                This only removes the recorded refresh log. Your playlists and their schedules are not affected.
            </p>
        </div>

        <div class="flex justify-end gap-3 p-4 border-t border-gray-200 dark:border-gray-700">
            <button id="clear-history-cancel-btn" type="button"
                class="px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800">
                Cancel
            </button>
            <button id="clear-history-confirm-btn" type="button"
                class="inline-flex items-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 dark:bg-red-600 dark:hover:bg-red-500 disabled:opacity-60 disabled:cursor-not-allowed">
                <svg id="clear-history-confirm-spinner" class="hidden size-4 animate-spin"
                    xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                </svg>
                <span id="clear-history-confirm-label">Clear History</span>
            </button>
        </div>
    </div>
</div>
